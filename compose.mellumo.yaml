# Mellumo local source build. Application/provider identifiers intentionally retain upstream names.
services:
  postiz:
    image: mellumo:dev
    restart: always
    environment:
      MAIN_URL: ${MELLUMO_APP_URL:-http://localhost:4210}
      FRONTEND_URL: ${MELLUMO_APP_URL:-http://localhost:4210}
      NEXT_PUBLIC_BACKEND_URL: ${MELLUMO_APP_URL:-http://localhost:4210}/api
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.mellumo}
      DATABASE_URL: postgresql://postiz-user:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD
        in .env.mellumo}@postiz-postgres:5432/postiz-db-local
      REDIS_URL: redis://postiz-redis:6379
      BACKEND_INTERNAL_URL: http://localhost:3000
      TEMPORAL_ADDRESS: temporal:7233
      IS_GENERAL: 'true'
      DISABLE_REGISTRATION: 'false'
      STORAGE_PROVIDER: local
      UPLOAD_DIRECTORY: /uploads
      NEXT_PUBLIC_UPLOAD_DIRECTORY: /uploads
      MASTODON_URL: https://mastodon.social
      API_LIMIT: 30
      FEE_AMOUNT: 0.05
      NX_ADD_PLUGINS: false
    volumes:
    - postiz-config:/config/
    - postiz-uploads:/uploads/
    ports:
    - 127.0.0.1:${MELLUMO_PORT:-4210}:5000
    networks:
    - postiz-network
    - temporal-network
    depends_on:
      postiz-postgres:
        condition: service_healthy
      postiz-redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.dev
      args:
        NEXT_PUBLIC_VERSION: mellumo-foundation
    env_file:
    - .env.mellumo
  postiz-postgres:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.mellumo}
      POSTGRES_USER: postiz-user
      POSTGRES_DB: postiz-db-local
    volumes:
    - postgres-volume:/var/lib/postgresql/data
    networks:
    - postiz-network
    healthcheck:
      test: pg_isready -U postiz-user -d postiz-db-local
      interval: 10s
      timeout: 3s
      retries: 3
  postiz-redis:
    image: redis:7.2
    restart: always
    healthcheck:
      test: redis-cli ping
      interval: 10s
      timeout: 3s
      retries: 3
    volumes:
    - postiz-redis-data:/data
    networks:
    - postiz-network
  temporal-elasticsearch:
    image: elasticsearch:7.17.27
    environment:
    - cluster.routing.allocation.disk.threshold_enabled=true
    - cluster.routing.allocation.disk.watermark.low=512mb
    - cluster.routing.allocation.disk.watermark.high=256mb
    - cluster.routing.allocation.disk.watermark.flood_stage=128mb
    - discovery.type=single-node
    - ES_JAVA_OPTS=-Xms256m -Xmx256m
    - xpack.security.enabled=false
    networks:
    - temporal-network
    expose:
    - 9200
    volumes:
    - temporal-elasticsearch-data:/var/lib/elasticsearch/data
  temporal-postgresql:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD
        in .env.mellumo}
      POSTGRES_USER: temporal
    networks:
    - temporal-network
    expose:
    - 5432
    volumes:
    - temporal-postgres-data:/var/lib/postgresql/data
  temporal:
    ports: []
    image: temporalio/auto-setup:1.28.1
    depends_on:
    - temporal-postgresql
    - temporal-elasticsearch
    environment:
    - DB=postgres12
    - DB_PORT=5432
    - POSTGRES_USER=temporal
    - POSTGRES_PWD=${TEMPORAL_POSTGRES_PASSWORD:?Set TEMPORAL_POSTGRES_PASSWORD in
      .env.mellumo}
    - POSTGRES_SEEDS=temporal-postgresql
    - DYNAMIC_CONFIG_FILE_PATH=config/dynamicconfig/development-sql.yaml
    - ENABLE_ES=true
    - ES_SEEDS=temporal-elasticsearch
    - ES_VERSION=v7
    - TEMPORAL_NAMESPACE=default
    networks:
    - temporal-network
    volumes:
    - ./dynamicconfig:/etc/temporal/config/dynamicconfig
    labels:
      kompose.volume.type: configMap
  temporal-ui:
    image: temporalio/ui:2.34.0
    environment:
    - TEMPORAL_ADDRESS=temporal:7233
    - TEMPORAL_CORS_ORIGINS=http://localhost:4211
    networks:
    - temporal-network
    ports:
    - 127.0.0.1:${MELLUMO_TEMPORAL_UI_PORT:-4211}:8080
volumes:
  postgres-volume:
    external: false
  postiz-redis-data:
    external: false
  postiz-config:
    external: false
  postiz-uploads:
    external: false
  temporal-elasticsearch-data: {}
  temporal-postgres-data: {}
networks:
  postiz-network:
    external: false
  temporal-network:
    driver: bridge
name: mellumo
