name: Source hygiene
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Check public foundation files
        shell: bash
        run: |
          set -euo pipefail
          for path in LICENSE NOTICE README.md CONTRIBUTING.md SECURITY.md docs/UPSTREAM.md; do
            test -s "$path"
          done
          git diff --check HEAD^ HEAD
          if git ls-files | grep -E '(^evaluation/|^\.local/|(^|/)\.env$|\.(pem|key|p12|p8)$)'; then
            echo "Local-only files must not be tracked."
            exit 1
          fi
